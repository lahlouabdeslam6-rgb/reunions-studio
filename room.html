<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Invitation · Réunions Studio</title><link rel="stylesheet" href="/room.css"><script src="/room.js" defer></script></head>
<body class="guest"><main>
<h1 class="room-heading">Réunions Studio</h1>
<form id="connect"><label for="name">Votre nom</label><input id="name" required maxlength="32" autocomplete="nickname" placeholder="Votre nom"><label class="consent"><input type="checkbox" id="consent" required> J’accepte que l’hôte puisse enregistrer l’audio de cet appel pour préparer le compte rendu.</label><button class="primary">Rejoindre la réunion</button></form>
<section id="session" class="call" hidden>
  <aside class="call-info"><h2>Participants</h2><p id="recording" class="recording" role="status" hidden></p><ul id="peers" aria-label="Participants"></ul><div id="call-notices"></div></aside>
  <div class="call-stage" aria-label="Caméras de la réunion"><div class="video-grid" id="videos" hidden></div><p class="stage-empty">Les caméras activées s’affichent ici.</p></div>
  <div class="controls call-controls" role="group" aria-label="Commandes d’appel"><button id="mute" type="button">Couper le micro</button><button id="camera" type="button" aria-pressed="false">Activer la caméra</button><button id="listen" type="button">Activer l’écoute</button><button id="leave" type="button">Quitter la salle</button></div>
</section>
<p id="status" role="status"></p><div id="remote-audio" hidden></div>
</main></body></html>
